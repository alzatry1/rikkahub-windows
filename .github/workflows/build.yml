name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src\RikkaHub.App\RikkaHub.App.csproj

      - name: Build
        run: dotnet build src\RikkaHub.App\RikkaHub.App.csproj -c Release -p:Platform=x64 -m

      - name: Publish (self-contained win-x64)
        run: dotnet publish src\RikkaHub.App\RikkaHub.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o publish

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress -y
        if: runner.os == 'Windows'

      - name: Build Installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\rikkahub.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-Windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
